[project]
name = "astrbot-plugin-roco-jinie-silhouette-recognition"
version = "0.1.0"
description = "识别洛克王国世界「我是谁」剪影题，发送精灵名称与原立绘。"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "APScheduler>=3.11,<4",
    "beautifulsoup4>=4.12,<5",
    "filelock>=3.13",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.13,<5",
]

[dependency-groups]
dev = [
    "astrbot>=4.12.4,<5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
logger-objects = ["astrbot.api.logger"]
